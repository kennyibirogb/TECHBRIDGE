<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/jpg" href="techbridge-logo.jpg"/>
<title>Lesson | TechBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,500&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #2A2420; --ink-soft: #7A6F62; --navy: #FAF6EE;
    --navy-card: rgba(255,255,255,0.6); --navy-card-solid: #FFFFFF;
    --line: rgba(42, 36, 32, 0.12);
    --cyan: #D9B24C; --blue: #8FA876; --mint: #7A9B6E; --amber: #D9A44A; --danger: #B8613B;
    --display: 'Fraunces', serif; --body: 'Work Sans', sans-serif; --mono: 'Space Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ background: var(--navy); color: var(--ink); font-family: var(--body); min-height:100vh; }
  .bg-overlay{
    position: fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(143,168,118,0.16), transparent 55%),
      radial-gradient(ellipse at 85% 60%, rgba(217,178,76,0.12), transparent 50%),
      linear-gradient(180deg, rgba(250,246,238,1) 0%, rgba(244,237,222,1) 45%, rgba(250,246,238,1) 100%);
    pointer-events:none;
  }
  header{
    position: sticky; top:0; z-index:999; display:flex; align-items:center; justify-content:space-between;
    padding:16px 5vw; background: rgba(250,246,238,.85); backdrop-filter: blur(10px); border-bottom:1px solid var(--line);
  }
  .mark{ display:flex; align-items:center; gap:12px; text-decoration:none; }
  .mark img{
    width: 34px;
    height: auto;
    flex-shrink: 0;
  }
  .mark-text{ display:flex; flex-direction:column; line-height:1.1; }
  .mark-text .main-name{ font-family: var(--display); font-weight:600; font-size:1.15rem; color: var(--ink); }
  .mark-text .sub-name{ font-family: var(--mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color: var(--blue); margin-top:2px; }
  .back-link{
    font-family: var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em;
    color: var(--ink-soft); text-decoration:none; display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); padding:8px 16px; border-radius:999px; transition: border-color .2s ease, color .2s ease;
  }
  .back-link:hover{ border-color: rgba(217,178,76,.35); color: var(--ink); }

  main{ min-width: 0; }

  .lesson-shell{
    max-width: 1180px; margin: 0 auto; padding: 2.4rem 6vw 5rem;
    display: grid; grid-template-columns: 270px 1fr; gap: 2.2rem; align-items: start;
  }

  /* ── Lesson list sidebar ── */
  .lesson-nav{
    position: sticky; top: 90px;
    background: var(--navy-card); border: 1px solid var(--line); border-radius: 16px;
    padding: 1.4rem 1.2rem; backdrop-filter: blur(6px);
    max-height: calc(100vh - 120px); overflow-y: auto;
  }
  .lesson-nav h3{
    font-family: var(--mono); font-size:.64rem; text-transform:uppercase; letter-spacing:.08em;
    color: var(--ink-soft); margin-bottom: 1rem;
  }
  .lesson-nav-list{ list-style:none; display:flex; flex-direction:column; gap:.3rem; }
  .lesson-nav-item a{
    display:flex; align-items:center; gap:.7rem; padding:.6rem .6rem; border-radius:10px;
    text-decoration:none; color: var(--ink-soft); font-size:.85rem; line-height:1.3;
    border: 1px solid transparent; transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .lesson-nav-item a:hover{ background: rgba(42,36,32,0.05); color: var(--ink); }
  .lesson-nav-item.is-current a{
    background: rgba(217,178,76,.14); color: var(--ink); border-color: rgba(217,178,76,.28);
  }
  .lesson-nav-item .ln-icon{
    width:22px; height:22px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
    font-family: var(--mono); font-size:.6rem; border:1px solid var(--line); color: var(--ink-soft);
  }
  .lesson-nav-item.is-done .ln-icon{ background: var(--mint); border-color: var(--mint); color:#2A2420; }
  .lesson-nav-item.is-current .ln-icon{ border-color: var(--cyan); color: var(--cyan); }
  .lesson-nav-item .ln-title{ flex:1; }
  .lesson-nav-item .ln-num{
    font-family: var(--mono); font-size:.62rem; color: var(--ink-soft); flex-shrink:0;
  }

  @media (max-width: 980px){
    .lesson-shell{ grid-template-columns: 230px 1fr; gap: 1.6rem; }
  }
  @media (max-width: 860px){
    .lesson-shell{ grid-template-columns: 1fr; padding: 1.8rem 5vw 4rem; }
    .lesson-nav{ position: static; max-height: none; order: -1; padding: 1.1rem 1rem; }
    .lesson-nav-list{ flex-direction: row; overflow-x: auto; padding-bottom: .3rem; gap:.5rem; }
    .lesson-nav-item{ flex-shrink: 0; }
    .lesson-nav-item a{ white-space: nowrap; }
  }

  .crumb{ font-family: var(--mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color: var(--blue); margin-bottom:.6rem; }
  .course-progress-row{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom: 1.6rem; }
  .course-progress-row .cp-label{ font-family: var(--mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color: var(--ink-soft); }
  .cp-track{ flex:1; height:7px; border-radius:999px; background: rgba(42,36,32,0.08); overflow:hidden; margin: 0 1rem; }
  .cp-fill{ height:100%; border-radius:999px; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .cp-pct{ font-family: var(--mono); font-size:.72rem; color: var(--cyan); font-weight:700; min-width: 3ch; text-align:right; }
  .cp-cert-btn{ order:4; padding: 8px 18px; font-size:.68rem; }

  h1.lesson-title{ font-family: var(--display); font-weight:600; font-size: clamp(1.7rem, 3.4vw, 2.4rem); margin-bottom: .7rem; }
  .lesson-meta{ display:flex; flex-wrap:wrap; gap: .6rem 1.4rem; font-family: var(--mono); font-size:.72rem; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom: 1.6rem; }
  .lesson-meta b{ color: var(--ink); font-weight:600; }
  .lesson-desc{ color: var(--ink-soft); line-height:1.7; margin-bottom: 2.2rem; max-width: 68ch; }

  .card{ background: var(--navy-card); border:1px solid var(--line); border-radius:16px; padding: 1.8rem 1.7rem; margin-bottom: 1.6rem; backdrop-filter: blur(6px); }
  .card h2{ font-family: var(--display); font-weight:600; font-size:1.2rem; margin-bottom: 1rem; display:flex; align-items:center; gap: .6rem; }
  .step-num{
    width: 26px; height:26px; border-radius:50%; background: rgba(217,178,76,.14); border:1px solid var(--cyan);
    color: var(--cyan); font-family: var(--mono); font-size:.72rem; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card.locked{ opacity:.5; }
  .card.locked h2 .step-num{ border-color: var(--line); color: var(--ink-soft); background:none; }
  .lock-note{ font-family: var(--mono); font-size:.68rem; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top: .4rem; }

  video{ width:100%; border-radius:12px; background:#000; display:block; }
  .video-fallback{
    aspect-ratio: 16/9; border-radius:12px; border: 1px dashed var(--line); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap: .6rem; color: var(--ink-soft); font-family: var(--mono); font-size:.72rem; text-align:center; padding: 1.5rem;
  }
  .resource-row{ display:flex; gap: .8rem; margin-top: 1.1rem; flex-wrap:wrap; }
  .resource-link{
    font-family: var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; text-decoration:none;
    color: var(--ink); border:1px solid var(--line); padding: 9px 16px; border-radius:999px; transition: border-color .2s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .resource-link:hover{ border-color: rgba(217,178,76,.35); }

  .quiz-q{ margin-bottom: 1.4rem; display:none; }
  .quiz-q.is-active{ display:block; }
  .quiz-q p{ font-weight:500; margin-bottom: .7rem; }
  .quiz-opt{ display:flex; align-items:center; gap:.7rem; padding: .55rem .3rem; cursor:pointer; border-radius:8px; transition: background .15s ease; }
  .quiz-opt:hover{ background: rgba(42,36,32,0.04); }
  .quiz-opt input{ accent-color: var(--cyan); width:16px; height:16px; }
  .quiz-opt.correct{ color: var(--mint); }
  .quiz-opt.wrong{ color: var(--danger); }

  .quiz-pager{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom: 1.3rem; }
  .quiz-num-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:transparent;
    color: var(--ink-soft); font-family: var(--mono); font-size:.78rem; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .quiz-num-btn:hover{ border-color: rgba(217,178,76,.35); color: var(--ink); }
  .quiz-num-btn.is-current{ border-color: var(--cyan); color: var(--cyan); background: rgba(217,178,76,.14); }
  .quiz-num-btn.is-answered:not(.is-current){ border-color: rgba(122,155,110,.35); color: var(--mint); }

  textarea{
    width:100%; min-height: 130px; background: rgba(250,246,238,.6); border:1px solid var(--line); border-radius:10px;
    color: var(--ink); font-family: var(--body); font-size:.92rem; padding: .9rem 1rem; resize: vertical;
  }
  textarea:focus{ outline:none; border-color: var(--cyan); }

  .btn{
    font-family: var(--mono); font-size:.74rem; text-transform:uppercase; letter-spacing:.03em; font-weight:700;
    padding: 11px 22px; border-radius:999px; border:none; cursor:pointer; transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    background: linear-gradient(90deg, var(--blue), var(--cyan)); color:#2A2420;
    text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
  }
  .btn:hover:not(:disabled){ transform: translateY(-2px); box-shadow: 0 8px 22px rgba(143,168,118,.3); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color: var(--ink); border:1px solid var(--line); }
  .btn-ghost:hover:not(:disabled){ border-color: var(--cyan); box-shadow:none; }
  .btn-row{ display:flex; gap: .8rem; flex-wrap:wrap; align-items:center; margin-top: .4rem; }
  .status-msg{ font-family: var(--mono); font-size:.72rem; margin-top: .8rem; }
  .status-msg.ok{ color: var(--mint); }
  .status-msg.err{ color: var(--danger); }

  .complete-panel{ text-align:center; padding: 2.4rem 1.7rem; }
  .complete-panel .big-check{ font-size: 2.2rem; color: var(--mint); margin-bottom: .8rem; }
  .complete-panel h2{ justify-content:center; }
  .complete-panel p{ color: var(--ink-soft); margin-bottom: 1.4rem; }

  @media (max-width: 640px){
    .lesson-shell{ padding: 1.8rem 5vw 4rem; }
    .course-progress-row{ flex-wrap:wrap; }
    .cp-track{ order:3; width:100%; margin: .5rem 0 0; }
    .cp-cert-btn{ width:100%; justify-content:center; margin-top:.5rem; }
  }
</style>
</head>
<body>

<div class="bg-overlay"></div>

<header>
  <a href="dashboard.html" class="mark">
    <img src="techbridge-logo.jpg" alt="TechBridge logo">
    <div class="mark-text">
      <span class="main-name">TechBridge</span>
      <span class="sub-name">Lesson</span>
    </div>
  </a>
  <a href="dashboard.html" class="back-link">&larr; Dashboard</a>
</header>

<div class="lesson-shell">
  <aside class="lesson-nav" id="lessonNav">
    <p style="font-family:var(--mono); color:var(--ink-soft); font-size:.75rem;">Loading…</p>
  </aside>
  <main id="lessonRoot">
    <p style="font-family:var(--mono); color:var(--ink-soft); font-size:.8rem;">Loading lesson…</p>
  </main>
</div>

<script src="course-data.js"></script>
<script src="instructor-data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const courseId = params.get("course");
  const requestedLessonId = params.get("lesson");
  const root = document.getElementById("lessonRoot");
  let currentQ = 0;
  // Declared up here (not just above wireAssignment() further down the file)
  // because wireAssignment() can run with an existing submission already on
  // record — in that case it reads/writes these two variables during the
  // very first synchronous render, before execution would otherwise reach
  // their old declaration site. Being `let`, that threw "Cannot access
  // before initialization" and aborted the rest of renderLesson() (including
  // wiring the "mark complete" button) on every revisit to a lesson after a
  // first assignment submission — which is why uploads looked like they
  // silently stopped working.
  let assignmentSubmitted = false;
  let pendingAssignmentFile = null; // the File object chosen but not yet submitted

  // ── Resolve course + lesson ────────────────────────────────────────────
  // The URL might carry no lesson param, a placeholder like "intro", or a
  // stale/typo'd id. Rather than dead-ending on "not found", we self-heal:
  // if the requested lesson doesn't exist, fall back to the learner's real
  // current lesson for this course (first incomplete lesson, or the last
  // one if the course is already finished) and generate that instead.
  const course = getCourse(courseId);
  let lesson = course ? getLesson(courseId, requestedLessonId) : null;
  let healed = false;

  if (course && !lesson) {
    lesson = getCurrentLesson(courseId);
    healed = true;
  }

  if (lesson && healed) {
    // Keep the address bar (and any bookmarks/back-button use) pointed at
    // the real lesson id going forward.
    const url = new URL(window.location.href);
    url.searchParams.set("lesson", lesson.id);
    window.history.replaceState({}, "", url);
  }

  // Prefer an instructor-authored quiz over the auto-generated placeholder
  // one, the moment a complete quiz has been set for this lesson. This is
  // the ONLY thing that changes about the quiz — rendering, scoring, and
  // the pager below all work exactly the same either way since
  // getInstructorQuiz() returns the same { q, options, answer } shape.
  if (course && lesson && typeof getInstructorQuiz === "function") {
    const customQuiz = getInstructorQuiz(courseId, lesson.id);
    if (customQuiz && customQuiz.length) {
      lesson.quiz = customQuiz;
      lesson.quizIsCustom = true;
    }
  }

  // Same override pattern for the assignment: if the instructor has set a
  // real question/task (with its own required submission format) for this
  // lesson, it replaces the auto-generated placeholder. Placeholder
  // assignments are always plain text.
  if (course && lesson) {
    const customAssignment = (typeof getInstructorAssignment === "function")
      ? getInstructorAssignment(courseId, lesson.id)
      : null;
    if (customAssignment) {
      lesson.assignment = customAssignment;
      lesson.assignmentIsCustom = true;
    } else {
      lesson.assignment.submissionType = "text";
    }
  }

  if (!course || !lesson) {
    document.getElementById("lessonNav").style.display = "none";
    root.innerHTML = `
      <div class="card">
        <h2>Course not found</h2>
        <p class="lesson-desc">We couldn't find "${courseId || "(no course)"}" in the catalog. It may have moved.</p>
        <a href="dashboard.html" class="btn">Back to dashboard</a>
      </div>`;
  } else {
    renderLessonNav();
    renderLesson();
  }

  function renderLessonNav() {
    const nav = document.getElementById("lessonNav");
    nav.innerHTML = `
      <h3>${course.title}</h3>
      <ul class="lesson-nav-list">
        ${course.lessons.map((l, i) => {
          const isCurrent = l.id === lesson.id;
          const isDone = l.completed;
          const cls = ['lesson-nav-item', isCurrent ? 'is-current' : '', isDone ? 'is-done' : ''].filter(Boolean).join(' ');
          const icon = isDone ? '&#10003;' : (i + 1);
          return `
            <li class="${cls}">
              <a href="lesson.html?course=${courseId}&lesson=${l.id}">
                <span class="ln-icon">${icon}</span>
                <span class="ln-title">${l.title}</span>
              </a>
            </li>`;
        }).join('')}
      </ul>
    `;
  }

  function lessonIndex() {
    return course.lessons.findIndex(l => l.id === lesson.id);
  }

  function renderLesson() {
    const idx = lessonIndex();
    const total = course.lessons.length;
    const pct = getCourseCompletionPercent(courseId);
    const already = isLessonComplete(lesson);

    root.innerHTML = `
      <div class="crumb">${course.category} · ${course.title}</div>
      <div class="course-progress-row">
        <span class="cp-label">Lesson ${idx + 1} of ${total}</span>
        <div class="cp-track"><div class="cp-fill" style="width:${pct}%"></div></div>
        <span class="cp-pct">${pct}%</span>
        ${isCourseComplete(courseId) ? (
          isCertificateEligible(courseId)
            ? `<a class="btn cp-cert-btn" href="certificate.html?course=${courseId}">&#127942; View certificate</a>`
            : `<a class="btn cp-cert-btn" href="certificate.html?course=${courseId}" style="opacity:.75;">&#8987; Awaiting instructor review</a>`
        ) : ''}
      </div>

      <h1 class="lesson-title">${lesson.title}</h1>
      <div class="lesson-meta">
        <span>Instructor: <b>${lesson.instructor}</b></span>
        <span>Duration: <b>${lesson.duration}</b></span>
        ${already ? '<span style="color: var(--mint);">&#10003; Already completed</span>' : ''}
      </div>
      <p class="lesson-desc">${lesson.description}</p>

      <div class="card">
        <h2><span class="step-num">1</span> Watch the lecture <span id="videoSourceBadge" style="display:none; font-family:var(--mono); font-size:.62rem; text-transform:uppercase; letter-spacing:.04em; color:var(--mint); border:1px solid rgba(122,155,110,.35); background:rgba(122,155,110,.1); padding:3px 9px; border-radius:999px; vertical-align:middle; margin-left:.5rem;">&#10003; Uploaded by your instructor</span></h2>
        <video id="lessonVideo" controls preload="metadata" poster="">
          <source src="${lesson.video}" type="video/mp4">
        </video>
        <div class="video-fallback" id="videoFallback" style="display:none;">
          Your instructor hasn't uploaded a video for this lesson yet. Once they do, it'll appear here automatically.
        </div>
        <div class="resource-row">
          <a class="resource-link" id="notesLink" href="${lesson.notes}" download>&#128196; Lesson notes (PDF)</a>
          <a class="resource-link" id="slidesLink" href="${lesson.slides}" download>&#128202; Slides (PDF)</a>
        </div>
      </div>

      <div class="card" id="quizCard">
        <h2><span class="step-num">2</span> Take the quiz <span id="quizSourceBadge" style="display:none; font-family:var(--mono); font-size:.62rem; text-transform:uppercase; letter-spacing:.04em; color:var(--mint); border:1px solid rgba(122,155,110,.35); background:rgba(122,155,110,.1); padding:3px 9px; border-radius:999px; vertical-align:middle; margin-left:.5rem;">&#10003; Set by your instructor</span></h2>
        <div class="quiz-pager" id="quizPager"></div>
        <form id="quizForm"></form>
        <div class="btn-row">
          <button class="btn btn-ghost" id="quizPrev" type="button">&larr; Previous</button>
          <button class="btn btn-ghost" id="quizNext" type="button">Next &rarr;</button>
          <button class="btn" id="quizSubmit" type="button">Submit quiz</button>
        </div>
        <div class="status-msg" id="quizStatus"></div>
      </div>

      <div class="card locked" id="assignmentCard">
        <h2><span class="step-num">3</span> Complete the assignment <span id="assignmentSourceBadge" style="display:none; font-family:var(--mono); font-size:.62rem; text-transform:uppercase; letter-spacing:.04em; color:var(--mint); border:1px solid rgba(122,155,110,.35); background:rgba(122,155,110,.1); padding:3px 9px; border-radius:999px; vertical-align:middle; margin-left:.5rem;">&#10003; Set by your instructor</span></h2>
        <p class="lesson-desc" style="margin-bottom:1rem;"><b style="color:var(--ink);">${lesson.assignment.title}.</b> ${lesson.assignment.brief}</p>
        ${lesson.assignment.submissionType === "text" ? `
          <textarea id="assignmentText" placeholder="Write your response here…" disabled></textarea>
        ` : `
          <label class="btn" id="assignmentFileLabel" style="display:inline-flex; width:fit-content; opacity:.35; pointer-events:none; cursor:pointer;">
            &#128206; Choose ${lesson.assignment.submissionType} to upload
            <input type="file" id="assignmentFile" accept="${(typeof SUBMISSION_TYPE_ACCEPT !== "undefined" && SUBMISSION_TYPE_ACCEPT[lesson.assignment.submissionType]) || ""}" disabled style="display:none;">
          </label>
          <div class="status-msg" id="assignmentFileName" style="margin-top:.6rem;"></div>
        `}
        <div class="btn-row">
          <button class="btn" id="assignmentSubmit" type="button" disabled>${lesson.assignment.submitLabel}</button>
        </div>
        <div class="status-msg" id="assignmentStatus"></div>
        <div class="lock-note" id="assignmentLockNote">Pass the quiz above to unlock this.</div>
      </div>

      <div class="card locked" id="completeCard">
        <h2><span class="step-num">4</span> Mark lesson complete</h2>
        <p class="lesson-desc" style="margin-bottom:1rem;">Once the quiz is passed and the assignment is submitted, wrap up this lesson to update your progress${idx === total - 1 ? " and send your work to your instructor for review — your certificate unlocks once they're satisfied with your performance" : " and move to the next lesson"}.</p>
        <div class="btn-row">
          <button class="btn" id="completeBtn" type="button" disabled>Mark lesson complete</button>
        </div>
      </div>
    `;

    // Video fallback: if the source 404s (expected in this scaffold since no
    // real video files are bundled), swap in a friendly placeholder instead
    // of a broken player.
    const videoEl = root.querySelector("video");
    videoEl.addEventListener("error", () => {
      videoEl.style.display = "none";
      document.getElementById("videoFallback").style.display = "flex";
    }, true);

    applyInstructorMaterials();
    const quizBadge = document.getElementById("quizSourceBadge");
    if (quizBadge) quizBadge.style.display = lesson.quizIsCustom ? "inline-block" : "none";
    const assignBadge = document.getElementById("assignmentSourceBadge");
    if (assignBadge) assignBadge.style.display = lesson.assignmentIsCustom ? "inline-block" : "none";
    renderQuiz();
    wireAssignment();
    wireComplete(idx, total, already);

    if (already) {
      // Already-completed lesson: unlock everything so it can be reviewed freely.
      unlockAssignment();
      document.getElementById("completeCard").classList.remove("locked");
      const btn = document.getElementById("completeBtn");
      btn.disabled = false;
      btn.textContent = "Reviewed — go to next";
    }
  }

  // Checks IndexedDB (via instructor-data.js) for a video/notes/slides file
  // this lesson's instructor has uploaded. If found, it replaces the
  // catalog's placeholder path so the real file plays/downloads instead —
  // otherwise the existing placeholder behavior (and its 404 fallback) is
  // left untouched.
  function applyInstructorMaterials() {
    if (typeof getInstructorMaterialURL !== "function") return;

    const videoEl = document.getElementById("lessonVideo");
    const videoFallback = document.getElementById("videoFallback");
    const videoBadge = document.getElementById("videoSourceBadge");
    const notesLink = document.getElementById("notesLink");
    const slidesLink = document.getElementById("slidesLink");

    getInstructorMaterialURL(courseId, lesson.id, "video").then((res) => {
      if (!res || !videoEl) return;
      const sourceEl = videoEl.querySelector("source");
      sourceEl.src = res.url;
      videoEl.load();
      videoEl.style.display = "";
      if (videoFallback) videoFallback.style.display = "none";
      if (videoBadge) videoBadge.style.display = "inline-block";
    });

    getInstructorMaterialURL(courseId, lesson.id, "notes").then((res) => {
      if (!res || !notesLink) return;
      notesLink.href = res.url;
      notesLink.setAttribute("download", res.name);
      notesLink.innerHTML = "&#128196; Lesson notes (PDF) &middot; from your instructor";
    });

    getInstructorMaterialURL(courseId, lesson.id, "slides").then((res) => {
      if (!res || !slidesLink) return;
      slidesLink.href = res.url;
      slidesLink.setAttribute("download", res.name);
      slidesLink.innerHTML = "&#128202; Slides (PDF) &middot; from your instructor";
    });
  }

  function renderQuiz() {
    const form = document.getElementById("quizForm");
    currentQ = 0;

    // All questions are rendered up front (so answers persist as you move
    // around) but only the current one is visible at a time via .is-active.
    form.innerHTML = lesson.quiz.map((q, qi) => `
      <div class="quiz-q${qi === 0 ? " is-active" : ""}" data-qi="${qi}">
        <p>${qi + 1}. ${q.q}</p>
        ${q.options.map((opt, oi) => `
          <label class="quiz-opt">
            <input type="radio" name="q${qi}" value="${oi}">
            <span>${opt}</span>
          </label>
        `).join("")}
      </div>
    `).join("");

    renderPager();
    updatePagerButtons();

    // Refresh the pager's "answered" dots whenever an option is picked.
    form.addEventListener("change", (e) => {
      if (e.target.matches('input[type="radio"]')) renderPager();
    });

    document.getElementById("quizPrev").addEventListener("click", () => goToQuestion(currentQ - 1));
    document.getElementById("quizNext").addEventListener("click", () => goToQuestion(currentQ + 1));

    document.getElementById("quizSubmit").addEventListener("click", () => {
      let correct = 0;
      let answeredAll = true;
      let firstUnanswered = -1;
      lesson.quiz.forEach((q, qi) => {
        const chosen = form.querySelector(`input[name="q${qi}"]:checked`);
        const optionEls = form.querySelectorAll(`.quiz-q[data-qi="${qi}"] .quiz-opt`);
        if (!chosen) {
          answeredAll = false;
          if (firstUnanswered === -1) firstUnanswered = qi;
          return;
        }
        const chosenVal = parseInt(chosen.value, 10);
        optionEls.forEach((el, oi) => {
          el.classList.remove("correct", "wrong");
          if (oi === q.answer) el.classList.add("correct");
          else if (oi === chosenVal) el.classList.add("wrong");
        });
        if (chosenVal === q.answer) correct++;
      });

      const statusEl = document.getElementById("quizStatus");
      if (!answeredAll) {
        statusEl.textContent = "Answer every question before submitting.";
        statusEl.className = "status-msg err";
        goToQuestion(firstUnanswered);
        return;
      }
      const scorePct = Math.round((correct / lesson.quiz.length) * 100);
      const passed = scorePct >= 70;
      statusEl.textContent = `Score: ${correct}/${lesson.quiz.length} (${scorePct}%) — ${passed ? "passed!" : "try again to reach 70%."}`;
      statusEl.className = "status-msg " + (passed ? "ok" : "err");
      // Persist the attempt so the instructor can see quiz performance
      // per student on their dashboard, same pattern as assignments.
      if (typeof saveQuizResult === "function") {
        saveQuizResult(courseId, lesson.id, correct, lesson.quiz.length, passed);
      }
      if (passed) unlockAssignment();
    });
  }

  function renderPager() {
    const pager = document.getElementById("quizPager");
    const form = document.getElementById("quizForm");
    pager.innerHTML = lesson.quiz.map((q, qi) => {
      const isCurrent = qi === currentQ;
      const isAnswered = !!form.querySelector(`input[name="q${qi}"]:checked`);
      const cls = ["quiz-num-btn", isCurrent ? "is-current" : "", isAnswered ? "is-answered" : ""].filter(Boolean).join(" ");
      return `<button type="button" class="${cls}" data-goto="${qi}" aria-label="Go to question ${qi + 1}">${qi + 1}</button>`;
    }).join("");
    pager.querySelectorAll("[data-goto]").forEach((btn) => {
      btn.addEventListener("click", () => goToQuestion(parseInt(btn.dataset.goto, 10)));
    });
  }

  function goToQuestion(qi) {
    if (qi < 0 || qi >= lesson.quiz.length) return;
    const form = document.getElementById("quizForm");
    form.querySelectorAll(".quiz-q").forEach((el) => el.classList.remove("is-active"));
    form.querySelector(`.quiz-q[data-qi="${qi}"]`).classList.add("is-active");
    currentQ = qi;
    renderPager();
    updatePagerButtons();
  }

  function updatePagerButtons() {
    document.getElementById("quizPrev").disabled = currentQ === 0;
    document.getElementById("quizNext").disabled = currentQ === lesson.quiz.length - 1;
  }

  function unlockAssignment() {
    const card = document.getElementById("assignmentCard");
    card.classList.remove("locked");
    const textEl = document.getElementById("assignmentText");
    if (textEl) textEl.disabled = false;
    const fileInput = document.getElementById("assignmentFile");
    if (fileInput) {
      fileInput.disabled = false;
      const label = document.getElementById("assignmentFileLabel");
      if (label) { label.style.opacity = "1"; label.style.pointerEvents = "auto"; label.style.cursor = "pointer"; }
    }
    document.getElementById("assignmentSubmit").disabled = false;
    document.getElementById("assignmentLockNote").style.display = "none";
  }

  function wireAssignment() {
    const submissionType = lesson.assignment.submissionType || "text";
    const isTextType = submissionType === "text";

    // Restore an earlier submission (if any) so returning to a lesson
    // shows what was actually turned in, instead of a blank box.
    const existing = typeof getAssignmentSubmission === "function"
      ? getAssignmentSubmission(courseId, lesson.id)
      : null;
    if (existing && (existing.text || existing.hasFile)) {
      if (isTextType && existing.text) {
        document.getElementById("assignmentText").value = existing.text;
      } else if (!isTextType && existing.hasFile) {
        const nameEl = document.getElementById("assignmentFileName");
        if (nameEl) {
          nameEl.innerHTML = `Currently submitted: <a href="#" id="assignmentFileViewLink">${existing.fileName}</a>${existing.fileSize ? " (" + formatFileSize(existing.fileSize) + ")" : ""}`;
          const viewLink = document.getElementById("assignmentFileViewLink");
          if (viewLink && typeof getSubmissionFileURL === "function") {
            viewLink.addEventListener("click", (e) => {
              e.preventDefault();
              getSubmissionFileURL(courseId, lesson.id).then((res) => {
                if (res) window.open(res.url, "_blank", "noopener");
              });
            });
          }
        }
      }
      assignmentSubmitted = true;
      unlockAssignment();
      const statusEl = document.getElementById("assignmentStatus");
      const when = new Date(existing.submittedAt).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      statusEl.textContent = `Submitted ${when}. Resubmitting will replace it.`;
      statusEl.className = "status-msg ok";
      document.getElementById("completeCard").classList.remove("locked");
      document.getElementById("completeBtn").disabled = false;
    }

    const fileInput = document.getElementById("assignmentFile");
    if (fileInput) {
      fileInput.addEventListener("change", () => {
        pendingAssignmentFile = fileInput.files[0] || null;
        const nameEl = document.getElementById("assignmentFileName");
        if (nameEl && pendingAssignmentFile) {
          nameEl.textContent = `Selected: ${pendingAssignmentFile.name} (${formatFileSize(pendingAssignmentFile.size)})`;
        }
      });
    }

    document.getElementById("assignmentSubmit").addEventListener("click", () => {
      const statusEl = document.getElementById("assignmentStatus");

      if (isTextType) {
        const text = document.getElementById("assignmentText").value.trim();
        if (text.length < 10) {
          statusEl.textContent = "Write a bit more before submitting.";
          statusEl.className = "status-msg err";
          return;
        }
        if (typeof submitAssignment === "function") {
          submitAssignment(courseId, lesson.id, { text });
        }
        finishAssignmentSubmit(statusEl);
        return;
      }

      // Upload types: need either a newly-chosen file, or an already-
      // submitted one being kept (student just clicked submit again).
      if (!pendingAssignmentFile && !(existing && existing.hasFile)) {
        statusEl.textContent = `Choose a ${submissionType} to upload before submitting.`;
        statusEl.className = "status-msg err";
        return;
      }
      if (!pendingAssignmentFile) {
        finishAssignmentSubmit(statusEl); // keeping the existing file as-is
        return;
      }
      if (typeof saveSubmissionFile !== "function" || typeof submitAssignment !== "function") {
        statusEl.textContent = "File submissions aren't available in this build.";
        statusEl.className = "status-msg err";
        return;
      }
      statusEl.textContent = "Uploading…";
      statusEl.className = "status-msg";
      saveSubmissionFile(courseId, lesson.id, pendingAssignmentFile)
        .then((meta) => {
          submitAssignment(courseId, lesson.id, {
            hasFile: true,
            fileName: meta.name,
            fileSize: meta.size,
            fileType: meta.type
          });
          finishAssignmentSubmit(statusEl);
        })
        .catch((err) => {
          statusEl.textContent = err.message || "Upload failed in this browser.";
          statusEl.className = "status-msg err";
        });
    });
  }

  function finishAssignmentSubmit(statusEl) {
    assignmentSubmitted = true;
    statusEl.textContent = "Assignment submitted.";
    statusEl.className = "status-msg ok";
    const completeCard = document.getElementById("completeCard");
    completeCard.classList.remove("locked");
    document.getElementById("completeBtn").disabled = false;
  }

  function wireComplete(idx, total, alreadyDone) {
    document.getElementById("completeBtn").addEventListener("click", () => {
      // NOTE: setLessonComplete needs the course id too, so progress is
      // stored per-course (lesson ids are only unique within a course).
      setLessonComplete(courseId, lesson.id, true);
      const next = getNextLesson(courseId, lesson.id);

      if (next) {
        window.location.href = `lesson.html?course=${courseId}&lesson=${next.id}`;
      } else if (isCourseComplete(courseId)) {
        // issueCertificate() only actually generates one once the instructor
        // has qualified this student — otherwise certificate.html itself
        // shows the "awaiting review" screen instead of a certificate.
        issueCertificate(courseId);
        window.location.href = `certificate.html?course=${courseId}`;
      } else {
        window.location.href = "dashboard.html";
      }
    });
  }
</script>
