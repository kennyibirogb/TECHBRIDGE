{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lesson | TechBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,500&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 :root{
  --ink: #1B2A4A;
  --ink-soft: #3D4E72;
  --paper: #F6F1E7;
  --paper-line: #BAB3A4;
  --card: #FFFDF8;
  --gold: #C9973F;
  --gold-deep: #A97B28;
  --sage: #7C9885;
  --track: rgba(27,42,74,.10);
  --danger: #B5563C;
  --display: 'Fraunces', serif; --body: 'Work Sans', sans-serif; --mono: 'Space Mono', monospace;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{ background: var(--paper); color: var(--ink); font-family: var(--body); min-height:100vh; }
.bg-overlay{
  position: fixed; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(201,151,63,0.14), transparent 55%),
    radial-gradient(ellipse at 85% 60%, rgba(169,123,40,0.08), transparent 50%),
    linear-gradient(180deg, var(--paper) 0%, #F1EADA 45%, var(--paper) 100%);
  pointer-events:none;
}
header{
  position: sticky; top:0; z-index:999; display:flex; align-items:center; justify-content:space-between;
  padding:16px 5vw; background: rgba(246,241,231,.92); backdrop-filter: blur(10px); border-bottom:1px solid var(--paper-line);
}
.mark{ display:flex; align-items:center; gap:12px; text-decoration:none; }
.mark img{ width: 34px; height: auto; flex-shrink: 0; }
.mark-text{ display:flex; flex-direction:column; line-height:1.1; }
.mark-text .main-name{ font-family: var(--display); font-weight:600; font-size:1.15rem; color: var(--ink); }
.mark-text .sub-name{ font-family: var(--mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color: var(--gold-deep); margin-top:2px; }
.back-link{
  font-family: var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em;
  color: var(--ink-soft); text-decoration:none; display:flex; align-items:center; gap:8px;
  border:1px solid var(--paper-line); padding:8px 16px; border-radius:999px; transition: border-color .2s ease, color .2s ease;
}
.back-link:hover{ border-color: var(--gold-deep); color: var(--ink); }

main{ min-width: 0; }

.lesson-shell{
  max-width: 1180px; margin: 0 auto; padding: 2.4rem 6vw 5rem;
  display: grid; grid-template-columns: 270px 1fr; gap: 2.2rem; align-items: start;
}

.lesson-nav{
  position: sticky; top: 90px;
  background: var(--card); border: 1px solid var(--paper-line); border-radius: 16px;
  padding: 1.4rem 1.2rem;
  max-height: calc(100vh - 120px); overflow-y: auto;
}
.lesson-nav h3{
  font-family: var(--mono); font-size:.64rem; text-transform:uppercase; letter-spacing:.08em;
  color: var(--ink-soft); margin-bottom: 1rem;
}
.lesson-nav-list{ list-style:none; display:flex; flex-direction:column; gap:.3rem; }
.lesson-nav-item a{
  display:flex; align-items:center; gap:.7rem; padding:.6rem .6rem; border-radius:10px;
  text-decoration:none; color: var(--ink-soft); font-size:.85rem; line-height:1.3;
  border: 1px solid transparent; transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.lesson-nav-item a:hover{ background: var(--track); color: var(--ink); }
.lesson-nav-item.is-current a{
  background: rgba(169,123,40,.1); color: var(--ink); border-color: var(--gold-deep);
}
.lesson-nav-item .ln-icon{
  width:22px; height:22px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
  font-family: var(--mono); font-size:.6rem; border:1px solid var(--paper-line); color: var(--ink-soft);
}
.lesson-nav-item.is-done .ln-icon{ background: var(--sage); border-color: var(--sage); color: var(--card); }
.lesson-nav-item.is-current .ln-icon{ border-color: var(--gold-deep); color: var(--gold-deep); }
.lesson-nav-item .ln-title{ flex:1; }
.lesson-nav-item .ln-num{ font-family: var(--mono); font-size:.62rem; color: var(--ink-soft); flex-shrink:0; }

@media (max-width: 980px){
  .lesson-shell{ grid-template-columns: 230px 1fr; gap: 1.6rem; }
}
@media (max-width: 860px){
  .lesson-shell{ grid-template-columns: 1fr; padding: 1.8rem 5vw 4rem; }
  .lesson-nav{ position: static; max-height: none; order: -1; padding: 1.1rem 1rem; }
  .lesson-nav-list{ flex-direction: row; overflow-x: auto; padding-bottom: .3rem; gap:.5rem; }
  .lesson-nav-item{ flex-shrink: 0; }
  .lesson-nav-item a{ white-space: nowrap; }
}

.crumb{ font-family: var(--mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color: var(--gold-deep); margin-bottom:.6rem; }
.course-progress-row{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom: 1.6rem; }
.course-progress-row .cp-label{ font-family: var(--mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color: var(--ink-soft); }
.cp-track{ flex:1; height:7px; border-radius:999px; background: var(--track); overflow:hidden; margin: 0 1rem; }
.cp-fill{ height:100%; border-radius:999px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.cp-pct{ font-family: var(--mono); font-size:.72rem; color: var(--gold-deep); font-weight:700; min-width: 3ch; text-align:right; }

h1.lesson-title{ font-family: var(--display); font-weight:600; font-size: clamp(1.7rem, 3.4vw, 2.4rem); margin-bottom: .7rem; }
.lesson-meta{ display:flex; flex-wrap:wrap; gap: .6rem 1.4rem; font-family: var(--mono); font-size:.72rem; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom: 1.6rem; }
.lesson-meta b{ color: var(--ink); font-weight:600; }
.lesson-desc{ color: var(--ink-soft); line-height:1.7; margin-bottom: 2.2rem; max-width: 68ch; }

.card{ background: var(--card); border:1px solid var(--paper-line); border-radius:16px; padding: 1.8rem 1.7rem; margin-bottom: 1.6rem; box-shadow: 5px 5px 0 rgba(27,42,74,.06); }
.card h2{ font-family: var(--display); font-weight:600; font-size:1.2rem; margin-bottom: 1rem; display:flex; align-items:center; gap: .6rem; }
.step-num{
  width: 26px; height:26px; border-radius:50%; background: rgba(169,123,40,.12); border:1px solid var(--gold-deep);
  color: var(--gold-deep); font-family: var(--mono); font-size:.72rem; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
}
.card.locked{ opacity:.55; }
.card.locked h2 .step-num{ border-color: var(--paper-line); color: var(--ink-soft); background:none; }
.lock-note{ font-family: var(--mono); font-size:.68rem; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top: .4rem; }

video{ width:100%; border-radius:12px; background:#000; display:block; }
.video-fallback{
  aspect-ratio: 16/9; border-radius:12px; border: 1px dashed var(--paper-line); display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap: .6rem; color: var(--ink-soft); font-family: var(--mono); font-size:.72rem; text-align:center; padding: 1.5rem;
}
.resource-row{ display:flex; gap: .8rem; margin-top: 1.1rem; flex-wrap:wrap; }
.resource-link{
  font-family: var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; text-decoration:none;
  color: var(--ink); border:1px solid var(--paper-line); padding: 9px 16px; border-radius:999px; transition: border-color .2s ease;
  display:inline-flex; align-items:center; gap:8px;
}
.resource-link:hover{ border-color: var(--gold-deep); }

.quiz-q{ margin-bottom: 1.4rem; }
.quiz-q p{ font-weight:500; margin-bottom: .7rem; }
.quiz-opt{ display:flex; align-items:center; gap:.7rem; padding: .55rem .3rem; cursor:pointer; border-radius:8px; transition: background .15s ease; }
.quiz-opt:hover{ background: var(--track); }
.quiz-opt input{ accent-color: var(--gold-deep); width:16px; height:16px; }
.quiz-opt.correct{ color: var(--sage); }
.quiz-opt.wrong{ color: var(--danger); }
.quiz-progress{ margin-bottom: 1.4rem; }
.quiz-progress span{
  font-family: var(--mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color: var(--ink-soft);
  display:block; margin-bottom:.5rem;
}
.quiz-progress-track{ height:6px; border-radius:999px; background: var(--track); overflow:hidden; }
.quiz-progress-fill{ height:100%; border-radius:999px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width .3s ease; }
.quiz-opt.selected{ background: rgba(169,123,40,.08); border: 1px solid var(--gold-deep); }
textarea{
  width:100%; min-height: 130px; background: var(--paper); border:1px solid var(--paper-line); border-radius:10px;
  color: var(--ink); font-family: var(--body); font-size:.92rem; padding: .9rem 1rem; resize: vertical;
}
textarea:focus{ outline:none; border-color: var(--gold-deep); }

.btn{
  font-family: var(--mono); font-size:.74rem; text-transform:uppercase; letter-spacing:.03em; font-weight:700;
  padding: 11px 22px; border-radius:999px; border:none; cursor:pointer; transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold)); color: var(--card);
  text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
}
.btn:hover:not(:disabled){ transform: translateY(-2px); box-shadow: 0 8px 22px rgba(169,123,40,.35); }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.btn-ghost{ background:transparent; color: var(--ink); border:1px solid var(--paper-line); }
.btn-ghost:hover:not(:disabled){ border-color: var(--gold-deep); box-shadow:none; }
.btn-row{ display:flex; gap: .8rem; flex-wrap:wrap; align-items:center; margin-top: .4rem; }
.status-msg{ font-family: var(--mono); font-size:.72rem; margin-top: .8rem; }
.status-msg.ok{ color: var(--sage); }
.status-msg.err{ color: var(--danger); }

.complete-panel{ text-align:center; padding: 2.4rem 1.7rem; }
.complete-panel .big-check{ font-size: 2.2rem; color: var(--sage); margin-bottom: .8rem; }
.complete-panel h2{ justify-content:center; }
.complete-panel p{ color: var(--ink-soft); margin-bottom: 1.4rem; }

@media (max-width: 640px){
  .lesson-shell{ padding: 1.8rem 5vw 4rem; }
  .course-progress-row{ flex-wrap:wrap; }
  .cp-track{ order:3; width:100%; margin: .5rem 0 0; }
}
</style>
</head>
<body>

<div class="bg-overlay"></div>

<header>
  <div class="mark">
    <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M13 2 L24 8 L13 14 L2 8 Z" stroke="#1B2A4A" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M6 11 V18 C6 20 9 22 13 22 C17 22 20 20 20 18 V11" stroke="#1B2A4A" stroke-width="1.5" fill="none"/>
    </svg>
    TechBridge
  </div>
  <a href="{% url 'studentdashboard' %}" class="back-link">&larr; Dashboard</a>
</header>

<div class="lesson-shell">
  <aside class="lesson-nav" id="lessonNav">
    <p style="font-family:var(--mono); color:var(--ink-soft); font-size:.75rem;">Loading…</p>
  </aside>
  <main id="lessonRoot">
    <p style="font-family:var(--mono); color:var(--ink-soft); font-size:.8rem;">Loading lesson…</p>
  </main>
</div>

<script src="{% static 'studentdashboard/js/course-data.js' %}"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const courseId = params.get("course");
  const requestedLessonId = params.get("lesson");
  const root = document.getElementById("lessonRoot");

  // ── Resolve course + lesson ────────────────────────────────────────────
  // The URL might carry no lesson param, a placeholder like "intro", or a
  // stale/typo'd id. Rather than dead-ending on "not found", we self-heal:
  // if the requested lesson doesn't exist, fall back to the learner's real
  // current lesson for this course (first incomplete lesson, or the last
  // one if the course is already finished) and generate that instead.
  const course = getCourse(courseId);
  let lesson = course ? getLesson(courseId, requestedLessonId) : null;
  let healed = false;

  if (course && !lesson) {
    lesson = getCurrentLesson(courseId);
    healed = true;
  }

  if (lesson && healed) {
    // Keep the address bar (and any bookmarks/back-button use) pointed at
    // the real lesson id going forward.
    const url = new URL(window.location.href);
    url.searchParams.set("lesson", lesson.id);
    window.history.replaceState({}, "", url);
  }

  if (!course || !lesson) {
    document.getElementById("lessonNav").style.display = "none";
    root.innerHTML = `
      <div class="card">
        <h2>Course not found</h2>
        <p class="lesson-desc">We couldn't find "${courseId || "(no course)"}" in the catalog. It may have moved.</p>
        <a href="{% url 'studentdashboard' %}" class="btn">Back to dashboard</a>
      </div>`;
  } else {
    renderLessonNav();
    renderLesson();
  }

  function renderLessonNav() {
    const nav = document.getElementById("lessonNav");
    nav.innerHTML = `
      <h3>${course.title}</h3>
      <ul class="lesson-nav-list">
        ${course.lessons.map((l, i) => {
          const isCurrent = l.id === lesson.id;
          const isDone = l.completed;
          const cls = ['lesson-nav-item', isCurrent ? 'is-current' : '', isDone ? 'is-done' : ''].filter(Boolean).join(' ');
          const icon = isDone ? '&#10003;' : (i + 1);
          return `
            <li class="${cls}">
              <a href="{% url 'lesson' %}?course=${courseId}&lesson=${l.id}">
                <span class="ln-icon">${icon}</span>
                <span class="ln-title">${l.title}</span>
              </a>
            </li>`;
        }).join('')}
      </ul>
    `;
  }

  function lessonIndex() {
    return course.lessons.findIndex(l => l.id === lesson.id);
  }

  function renderLesson() {
    const idx = lessonIndex();
    const total = course.lessons.length;
    const pct = getCourseCompletionPercent(courseId);
    const already = isLessonComplete(lesson);

    root.innerHTML = `
      <div class="crumb">${course.category} · ${course.title}</div>
      <div class="course-progress-row">
        <span class="cp-label">Lesson ${idx + 1} of ${total}</span>
        <div class="cp-track"><div class="cp-fill" style="width:${pct}%"></div></div>
        <span class="cp-pct">${pct}%</span>
      </div>

      <h1 class="lesson-title">${lesson.title}</h1>
      <div class="lesson-meta">
        <span>Instructor: <b>${lesson.instructor}</b></span>
        <span>Duration: <b>${lesson.duration}</b></span>
        ${already ? '<span style="color: var(--sage);">&#10003; Already completed</span>' : ''}
      </div>
      <p class="lesson-desc">${lesson.description}</p>

      <div class="card">
        <h2><span class="step-num">1</span> Watch the lecture</h2>
        <video controls preload="metadata" poster="">
          <source src="${lesson.video}" type="video/mp4">
        </video>
        <div class="video-fallback" id="videoFallback" style="display:none;">
          Video file not found at <code>${lesson.video}</code> in this scaffold — drop the real file at that path and it will play automatically.
        </div>
        <div class="resource-row">
          <a class="resource-link" href="${lesson.notes}" download>&#128196; Lesson notes (PDF)</a>
          <a class="resource-link" href="${lesson.slides}" download>&#128202; Slides (PDF)</a>
        </div>
      </div>

      <div class="card" id="quizCard">
        <h2><span class="step-num">2</span> Take the quiz</h2>
        <div class="quiz-progress">
          <span id="quizProgressLabel">Question 1 of ${lesson.quiz.length}</span>
          <div class="quiz-progress-track"><div class="quiz-progress-fill" id="quizProgressFill"></div></div>
       </div>
       <div id="quizSlide"></div>
       <div class="btn-row">
         <button class="btn btn-ghost" id="quizPrev" type="button" disabled>&larr; Previous</button>
         <button class="btn" id="quizNext" type="button">Next &rarr;</button>
         <button class="btn" id="quizSubmit" type="button" style="display:none;">Submit quiz</button>
      </div>
      <div class="status-msg" id="quizStatus"></div>
     </div>

      <div class="card locked" id="assignmentCard">
         <h2><span class="step-num">3</span> Complete the assignment</h2>
         <p class="lesson-desc" style="margin-bottom:1rem;"><b style="color:var(--ink);">${lesson.assignment.title}.</b> ${lesson.assignment.brief}</p>
         <textarea id="assignmentText" placeholder="Write your response here…" disabled></textarea>
         <div class="btn-row">
            <button class="btn" id="assignmentSubmit" type="button" disabled>${lesson.assignment.submitLabel}</button>
         </div>
         <div class="status-msg" id="assignmentStatus"></div>
         <div class="lock-note" id="assignmentLockNote">Pass the quiz above to unlock this.</div>
       </div>

      <div class="card locked" id="completeCard">
        <h2><span class="step-num">4</span> Mark lesson complete</h2>
        <p class="lesson-desc" style="margin-bottom:1rem;">Once the quiz is passed and the assignment is submitted, wrap up this lesson to update your progress${idx === total - 1 ? " and unlock your certificate" : " and move to the next lesson"}.</p>
        <div class="btn-row">
          <button class="btn" id="completeBtn" type="button" disabled>Mark lesson complete</button>
        </div>
      </div>
    `;

    // Video fallback: if the source 404s (expected in this scaffold since no
    // real video files are bundled), swap in a friendly placeholder instead
    // of a broken player.
    const videoEl = root.querySelector("video");
    videoEl.addEventListener("error", () => {
      videoEl.style.display = "none";
      document.getElementById("videoFallback").style.display = "flex";
    }, true);

    renderQuiz();
    wireAssignment();
    wireComplete(idx, total, already);

    if (already) {
      // Already-completed lesson: unlock everything so it can be reviewed freely.
      unlockAssignment();
      document.getElementById("completeCard").classList.remove("locked");
      const btn = document.getElementById("completeBtn");
      btn.disabled = false;
      btn.textContent = "Reviewed — go to next";
    }
  }

  function renderQuiz() {
  const slide = document.getElementById("quizSlide");
  const progressLabel = document.getElementById("quizProgressLabel");
  const progressFill = document.getElementById("quizProgressFill");
  const prevBtn = document.getElementById("quizPrev");
  const nextBtn = document.getElementById("quizNext");
  const submitBtn = document.getElementById("quizSubmit");
  const statusEl = document.getElementById("quizStatus");

  const total = lesson.quiz.length;
  const answers = new Array(total).fill(null);
  let current = 0;

  function renderSlide() {
    const q = lesson.quiz[current];
    slide.innerHTML = `
      <div class="quiz-q">
        <p>${current + 1}. ${q.q}</p>
        ${q.options.map((opt, oi) => `
          <label class="quiz-opt${answers[current] === oi ? ' selected' : ''}">
            <input type="radio" name="quizCurrent" value="${oi}" ${answers[current] === oi ? 'checked' : ''}>
            <span>${opt}</span>
          </label>
        `).join("")}
      </div>
    `;

    slide.querySelectorAll('input[name="quizCurrent"]').forEach(input => {
      input.addEventListener('change', (e) => {
        answers[current] = parseInt(e.target.value, 10);
        slide.querySelectorAll('.quiz-opt').forEach(el => el.classList.remove('selected'));
        e.target.closest('.quiz-opt').classList.add('selected');
      });
    });

    progressLabel.textContent = `Question ${current + 1} of ${total}`;
    progressFill.style.width = `${((current + 1) / total) * 100}%`;
    prevBtn.disabled = current === 0;

    const isLast = current === total - 1;
    nextBtn.style.display = isLast ? 'none' : 'inline-flex';
    submitBtn.style.display = isLast ? 'inline-flex' : 'none';
    statusEl.textContent = '';
    statusEl.className = 'status-msg';
  }

  prevBtn.addEventListener('click', () => {
    if (current > 0) { current--; renderSlide(); }
  });

  nextBtn.addEventListener('click', () => {
    if (answers[current] === null) {
      statusEl.textContent = "Select an answer before continuing.";
      statusEl.className = "status-msg err";
      return;
    }
    if (current < total - 1) { current++; renderSlide(); }
  });

  submitBtn.addEventListener('click', () => {
    if (answers[current] === null) {
      statusEl.textContent = "Select an answer before submitting.";
      statusEl.className = "status-msg err";
      return;
    }
    const answeredAll = answers.every(a => a !== null);
    if (!answeredAll) {
      statusEl.textContent = "You have unanswered questions. Use Previous to go back and complete them.";
      statusEl.className = "status-msg err";
      return;
    }

    let correct = 0;
    lesson.quiz.forEach((q, qi) => { if (answers[qi] === q.answer) correct++; });

    const scorePct = Math.round((correct / total) * 100);
    const passed = scorePct >= 70;

    slide.innerHTML = `
      <div class="quiz-review">
        ${lesson.quiz.map((q, qi) => `
          <div class="quiz-q">
            <p>${qi + 1}. ${q.q}</p>
            ${q.options.map((opt, oi) => {
              let cls = '';
              if (oi === q.answer) cls = 'correct';
              else if (oi === answers[qi]) cls = 'wrong';
              return `<label class="quiz-opt ${cls}"><span>${opt}</span></label>`;
            }).join("")}
          </div>
        `).join("")}
      </div>
    `;
    progressLabel.textContent = `Review — ${total} of ${total} answered`;
    progressFill.style.width = '100%';
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    submitBtn.style.display = 'none';

    statusEl.textContent = `Score: ${correct}/${total} (${scorePct}%) — ${passed ? "passed!" : "try again to reach 70%."}`;
    statusEl.className = "status-msg " + (passed ? "ok" : "err");
    if (passed) unlockAssignment();
  });

  renderSlide();
}

  function unlockAssignment() {
    const card = document.getElementById("assignmentCard");
    card.classList.remove("locked");
    document.getElementById("assignmentText").disabled = false;
    document.getElementById("assignmentSubmit").disabled = false;
    document.getElementById("assignmentLockNote").style.display = "none";
  }

  let assignmentSubmitted = false;
  function wireAssignment() {
    document.getElementById("assignmentSubmit").addEventListener("click", () => {
      const text = document.getElementById("assignmentText").value.trim();
      const statusEl = document.getElementById("assignmentStatus");
      if (text.length < 10) {
        statusEl.textContent = "Write a bit more before submitting.";
        statusEl.className = "status-msg err";
        return;
      }
      assignmentSubmitted = true;
      statusEl.textContent = "Assignment submitted.";
      statusEl.className = "status-msg ok";
      const completeCard = document.getElementById("completeCard");
      completeCard.classList.remove("locked");
      document.getElementById("completeBtn").disabled = false;
    });
  }

  function wireComplete(idx, total, alreadyDone) {
    document.getElementById("completeBtn").addEventListener("click", () => {
      // NOTE: setLessonComplete needs the course id too, so progress is
      // stored per-course (lesson ids are only unique within a course).
      setLessonComplete(courseId, lesson.id, true);
      const next = getNextLesson(courseId, lesson.id);

      if (next) {
        window.location.href = `lesson.html?course=${courseId}&lesson=${next.id}`;
      } else if (isCourseComplete(courseId)) {
        issueCertificate(courseId);
        window.location.href = `{% url 'certificate' %}?course=${courseId}`;
      } else {
        window.location.href = "{% url 'studentdashboard' %}";
      }
    });
  }
</script>
