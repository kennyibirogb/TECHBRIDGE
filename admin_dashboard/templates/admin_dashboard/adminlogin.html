<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f1c2e 0%, #1B2A4A 100%);
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .login-box h1 {
      font-size: 24px;
      color: #1B2A4A;
      margin-bottom: 6px;
    }

    .login-box p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #1B2A4A;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #1B2A4A;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: #1B2A4A;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #2c3e6b;
    }

    .signup-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #64748b;
    }

    .signup-link a {
      color: #1B2A4A;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Admin Login</h1>
    <p>Sign in to your administrator account</p>

    <form action="{% url 'admin_login' %}" method="POST">
      {% csrf_token %}
      {% if messages %}
        {% for message in messages %}
         <p style="color:red;font-size:13px;">{{ message }}</p>
       {% endfor %}
     {% endif %}
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="admin@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="signup-link">
      Don’t have an account? <a href="{% url 'admin_signup' %}">Sign up</a>
    </div>
  </div>

</body>
</html>
