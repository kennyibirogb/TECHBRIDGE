{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | TechBridge</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        #0f1c2e 0%,
        #1B2A4A 100%
      );
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .login-box h1 {
      font-size: 24px;
      color: #1B2A4A;
      margin-bottom: 6px;
    }

    .login-box > p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      list-style: none;
      margin-bottom: 20px;
      padding: 0;
    }

    .messages li {
      padding: 10px 12px;
      border-radius: 7px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .messages .msg-error {
      color: #b91c1c;
      background: #fee2e2;
    }

    .messages .msg-success {
      color: #15803d;
      background: #dcfce7;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;

      font-size: 13px;
      font-weight: 500;
      color: #1B2A4A;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;

      border: 1.5px solid #e2e8f0;
      border-radius: 8px;

      font-size: 14px;
      outline: none;

      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #1B2A4A;
      box-shadow: 0 0 0 3px rgba(27, 42, 74, 0.08);
    }

    /* =========================
       BUTTON
    ========================= */

    .login-btn {
      width: 100%;
      padding: 13px;

      margin-top: 4px;

      background: #1B2A4A;
      color: #ffffff;

      border: none;
      border-radius: 8px;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: background 0.2s, transform 0.1s;
    }

    .login-btn:hover {
      background: #2c3e6b;
    }

    .login-btn:active {
      transform: scale(0.99);
    }

    /* =========================
       SIGN UP
    ========================= */

    .signup-link {
      text-align: center;

      margin-top: 22px;

      font-size: 14px;
      color: #64748b;
    }

    .signup-link a {
      color: #1B2A4A;
      font-weight: 600;

      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }
  </style>

</head>

<body>

  <div class="login-box">

```
<h1>Admin Login</h1>

<p>
  Sign in to your administrator account
</p>

<!-- =========================
     DJANGO MESSAGES
========================== -->

{% if messages %}
  <ul class="messages">
    {% for message in messages %}
      <li class="msg-{{ message.tags }}">
        {{ message }}
      </li>
    {% endfor %}
  </ul>
{% endif %}


<!-- =========================
     LOGIN FORM
========================== -->

<form method="POST">

  {% csrf_token %}

  <div class="form-group">
    <label for="username">
      Username
    </label>

    <input
      type="text"
      id="username"
      name="username"
      placeholder="Enter your username"
      autocomplete="username"
      required
    >
  </div>


  <div class="form-group">
    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      name="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >
  </div>


  <button
    type="submit"
    class="login-btn"
  >
    Login
  </button>

</form>


<!-- =========================
     SIGN UP LINK
========================== -->

<div class="signup-link">
  Don’t have an account?
  <a href="{% url 'admin_signup' %}">
    Sign up
  </a>
</div>

  </div>

</body>
</html>
